<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>    
    <h1>Registro de usuarios</h1>
    <form>
        <div>
            <!-- label: es una descripcion para el usuario sobre que se espera recibir en este campo  -->
            <label for="fullname">Nombre completo</label>

            <!--input: es la etiqueta que utilizamos para que el usuario pueda ingresar informacion  -->
            <input type="text"id="fullname" name="fullname"  required maxlength="10" minlength="3" placeholder="Jose Gomez"></id=></input>
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" placeholder="jhon doe@gmail.com" required id="email" name="email">
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" required id="password" name="password">
        </div>
        
        <div>
            <span>Elije tu lenguaje favorito</span>
            <div>
                <label for="html">HTML</label>
                <input type="radio" name="lenguaje_fav" id="html">
            </div>
            <div>
                <label for="css">CSS</label>
                <input type="radio" name="lenguaje_fav" id="css">
            </div>
            <div>
                <label for="js">JAVASCRIPT </label>
                <input type="radio" name="lenguaje_fav" id="js">
            </div>
        </div>
                <div>
            <span>Seleccione un lenguaje</span>
            <div>
                <label for="know_html">HTML</label>
                <input type="checkbox" name="lenguaje_conocido" id="know_html">
            </div>
            <div>
                <label for="know_css">CSS</label>
                <input type="checkbox" name="lenguaje_conocido" id="know_css">
            </div>
            <div>
                <label for="know_js">JAVASCRIPT </label>
                <input type="checkbox" name="lenguaje_conocido" id="know_js">
            </div>
        </div>
        <!-- Select: combo de opciones -->
         <div>
            <label for="pais">Elige tu pais de origen</label>
            <select id="pais" name="pais_origen">
                <option value="ar">Argentina</option>
                <option value="fr">Francia</option>
                <option value="br">Brasil</option>
                <option value="no" selected disabled>No seleccionado</option>
            </select>
         </div>
        
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
